# ======== DATABASE (POSTGRESQL) ========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxi_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:adm}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======== JPA / HIBERNATE ========
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ======== LOGGING (ЛОГИРОВАНИЕ) ========
logging.level.org.springframework.security=${LOGGING_LEVEL_SPRING_SECURITY:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.taxiapp=${LOGGING_LEVEL_TAXIAAPP:DEBUG}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
# ======== SERVER CONFIG ========
app.server.url=http://192.168.0.107:8080
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always

# ======== MAIL CONFIG ========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=unit.taxi.service@gmail.com
spring.mail.password=${MAIL_PASSWORD:ghwb mimt gfxy ltul}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ======== FLYWAY MIGRATION ========
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ======== LIQPAY ========
